[project]
name = "cendor-cassette"
version = "1.1.0"
description = "Record real LLM calls once, then replay them in your tests forever — offline, no API key, no cost, and the same result every run."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "testing", "record-replay", "offline", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = ["cendor-core>=1.9,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/cassette"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.optional-dependencies]
embeddings = ["model2vec>=0.3"]   # optional: free, offline local embeddings for semantic_match (numpy-only, no torch)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/cassette only — NEVER add src/cendor/__init__.py

# Bundle the shared assistant/integration guide (verbatim copy of the repo-root canonical
# cendor-libs/INTEGRATION.md; must sit in the package root to round-trip through the sdist).
[tool.hatch.build.targets.wheel.force-include]
"INTEGRATION.md" = "cendor/cassette/INTEGRATION.md"
