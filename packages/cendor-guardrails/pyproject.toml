[project]
name = "cendor-guardrails"
version = "1.4.0"
description = "A local-first gate for LLM apps: define a check — keyword, regex, URL, length, JSON-schema — attach it to a stage (input, tool call, tool output, output). Deterministic, microsecond, $0, and every decision is audit-grade evidence."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "guardrails", "governance", "safety", "gate", "validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
# >=1.1: install()'s redact-before-send needs core's Reroute(messages=…), added in cendor-core 1.1.
dependencies = ["cendor-core>=1.1,<2.0"]

[project.optional-dependencies]
# Opt-in detection-tier adapters (docs/guardrails.md "Threat model"). Never hard deps — the base
# package stays deterministic + local-first. Model WEIGHTS are never bundled: `promptguard` pulls
# only the runtime; you download the (license-gated) model from Hugging Face yourself.
promptguard = ["transformers>=4.40"]  # a prompt-injection classifier adapter (rules.prompt_guard)
langid = ["py3langid>=0.3"]           # a local language detector (rules.language default detect)
# A free, offline embedder for the semantic checks (rules.custom_category / denied_topics /
# groundedness / intent). model2vec is numpy-only (no torch); model WEIGHTS are never bundled — you
# pull the (small, static) checkpoint from Hugging Face yourself. Mirrors cendor-cassette[embeddings].
embeddings = ["model2vec>=0.3"]       # embeddings.local_embedder (semantic rules ignition)
# Config-as-data: load_policy() reads JSON with the stdlib; YAML needs PyYAML.
yaml = ["pyyaml>=6"]
# Hosted-rail convenience extras. The adapters DUCK-TYPE the client (nothing here imports these), so
# these only install the vendor SDK for you — you still bring the cloud account + credentials.
bedrock = ["boto3>=1.34"]                      # rules.bedrock_guardrail (AWS ApplyGuardrail)
azure = ["azure-ai-contentsafety>=1.0"]        # rules.azure_content_safety (Prompt Shields)
modelarmor = ["google-cloud-modelarmor>=0.2"]  # rules.model_armor (Google Model Armor)

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/guardrails"
Repository = "https://github.com/cendorhq/cendor-libs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/guardrails only — NEVER add src/cendor/__init__.py
# Ship the policy JSON Schema (config tooling — NOT model data): editors resolve `$schema`, and
# load_policy(validate=True) / policy_schema() read it at runtime via importlib.resources.
artifacts = ["src/cendor/guardrails/policy.schema.json"]
