[project]
name = "cendor-squeeze"
version = "1.0.2"
description = "Shrink long prompts to hit a token budget and expand them back exactly — the same input always produces the same output."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "compression", "context", "tokens", "prompt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = ["cendor-core>=1.0,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/squeeze"
Repository = "https://github.com/cendorhq/cendor-libs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/squeeze only — NEVER add src/cendor/__init__.py
