[project]
name = "cendor-contextkit"
version = "1.0.0"
description = "Assemble: declare prioritized, pinnable context blocks; pack them to a token budget with an inspectable receipt."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra" }]
readme = "README.md"
dependencies = ["cendor-core>=1.0,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.optional-dependencies]
# Wires squeeze in as the evict="compress" strategy (via core's Compressor protocol).
squeeze = ["cendor-squeeze>=1.0,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/contextkit only — NEVER add src/cendor/__init__.py
