[project]
name = "cendor-contextkit"
version = "1.0.2"
description = "Fit a prompt into the model's token budget — add your messages and context, pin what must stay, and the least-important parts are dropped to make it fit."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "context-window", "prompt", "token-budget", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = ["cendor-core>=1.0,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/contextkit"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.optional-dependencies]
# Wires squeeze in as the evict="compress" strategy (via core's Compressor protocol).
squeeze = ["cendor-squeeze>=1.0,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/contextkit only — NEVER add src/cendor/__init__.py

# Bundle the shared assistant/integration guide (verbatim copy of the repo-root canonical
# cendor-libs/INTEGRATION.md; must sit in the package root to round-trip through the sdist).
[tool.hatch.build.targets.wheel.force-include]
"INTEGRATION.md" = "cendor/contextkit/INTEGRATION.md"
