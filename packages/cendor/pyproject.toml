# The brand alias meta-package: `pip install cendor` → the whole stack, via `cendor-libs`. Ships NO code.
# NEVER add a src/ directory or a cendor/__init__.py here — it would break the namespace.
# Its ONLY dependency is `cendor-libs` (the canonical umbrella). This keeps the `cendor` name a
# permanent, intuition-proof, zero-maintenance pointer — brand protected, but not the documented
# default (`pip install cendor-libs` is). See PLAN §4.2.
[project]
name = "cendor"
version = "1.1.0"
description = "Brand alias that installs the full Cendor stack (cendor-libs). Prefer: pip install cendor-libs."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Raghav Mishra" }]
dependencies = [
  "cendor-libs>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Repository = "https://github.com/cendorhq/cendor-libs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true     # deps-only meta-package: builds an empty wheel, contributes no code
