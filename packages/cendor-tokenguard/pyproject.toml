[project]
name = "cendor-tokenguard"
version = "1.1.0"
description = "Budget: pre-flight cost caps, spend attribution, and circuit-breakers for LLM calls."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra" }]
readme = "README.md"
dependencies = ["cendor-core>=1.0,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/Cendor"
Repository = "https://github.com/cendorhq/Cendor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/tokenguard only — NEVER add src/cendor/__init__.py
