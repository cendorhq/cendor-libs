[project]
name = "cendor-tokenguard"
version = "1.4.0"
description = "Spending limits for LLM calls: stop a call before it runs if it would blow the budget, and see cost broken down per feature."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "cost", "budget", "token-limit", "cost-attribution"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = ["cendor-core>=1.9,<2.0"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/tokenguard"
Repository = "https://github.com/cendorhq/cendor-libs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/tokenguard only — NEVER add src/cendor/__init__.py

# Bundle the shared assistant/integration guide (verbatim copy of the repo-root canonical
# cendor-libs/INTEGRATION.md; must sit in the package root to round-trip through the sdist).
[tool.hatch.build.targets.wheel.force-include]
"INTEGRATION.md" = "cendor/tokenguard/INTEGRATION.md"
