[project]
name = "cendor-acttrace"
version = "1.4.1"
description = "An automatic, tamper-evident log of your AI's decisions — every model and tool call is recorded and can be verified offline; change any past entry and the check fails."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "audit", "governance", "tamper-evident", "eu-ai-act"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
# >=1.1: guard()'s redact-before-send needs core's Reroute(messages=…), added in cendor-core 1.1.
dependencies = ["cendor-core>=1.1,<2.0"]

[project.optional-dependencies]
# Optional NER-backed redaction for free-text names/addresses (Microsoft Presidio). Never a hard
# dependency — the default install stays pure-regex and offline. See docs/acttrace.md.
ner = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/acttrace"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.scripts]
acttrace = "cendor.acttrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/acttrace only — NEVER add src/cendor/__init__.py
