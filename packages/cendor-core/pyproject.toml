[project]
name = "cendor-core"
version = "1.17.0"
description = "Wrap your LLM client once and capture exact token counts and cost on every call — the shared foundation the other Cendor tools build on."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "tokens", "cost", "pricing", "instrumentation", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
# tiktoken is a REQUIRED dependency: exact, truthful token counts are the product, not an add-on.
# (The char/subword heuristic remains in code only as a defensive fallback if tiktoken ever fails to
# import — never the default a normal install lands on. This mirrors @cendor/core, which hard-deps
# js-tiktoken.) tiktoken is offline (no network/account), so this keeps the local-first guarantee.
dependencies = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/core"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
tiktoken = []                  # back-compat no-op: tiktoken is now a REQUIRED dependency (above)
# optional: the CendorCallbackHandler for LangChain/LangGraph (cendor.core.langchain). The handler
# reads only usage_metadata + run ids — a far more stable surface than client internals.
langchain = ["langchain-core>=0.3"]
# optional: CendorAgentHooks for the OpenAI Agents SDK (cendor.core.openai_agents). Sources the
# framework's agent name onto the bus via the RunHooks lifecycle surface; the agent's model calls ride
# the standard OpenAI client, so instrument() still captures tokens/cost/streaming (GLR-11c).
openai-agents = ["openai-agents>=0.1"]
# optional: Foundry correlation adapter (cendor.core.foundry) — observes Azure AI Foundry Agents
# thread-run creation and stamps agent id + conversation id. Attribution-only (model runs server-side).
foundry = ["azure-ai-agents>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/core only — NEVER add src/cendor/__init__.py

# Bundle the shared "how to call Cendor" guide into the wheel (lands at
# site-packages/cendor/core/INTEGRATION.md) so humans grep it and some assistants read it. The file
# is a verbatim copy of the repo-root canonical cendor-libs/INTEGRATION.md — it must live inside the
# package root so it round-trips through the sdist (uv builds the wheel FROM the sdist, and pip can
# build from source), which a ../../ path cannot. Keep it in sync with the root canonical.
[tool.hatch.build.targets.wheel.force-include]
"INTEGRATION.md" = "cendor/core/INTEGRATION.md"
