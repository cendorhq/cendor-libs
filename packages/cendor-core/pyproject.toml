[project]
name = "cendor-core"
version = "1.3.0"
description = "Foundation for the Cendor stack: shared types, token counting, offline-first & refreshable prices, instrument(), event bus, OTel."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra" }]
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/cendorhq/Cendor"
Repository = "https://github.com/cendorhq/Cendor"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
tiktoken = ["tiktoken>=0.7"]   # optional: exact OpenAI token counts (heuristic fallback otherwise)
# optional: the CendorCallbackHandler for LangChain/LangGraph (cendor.core.langchain). The handler
# reads only usage_metadata + run ids — a far more stable surface than client internals.
langchain = ["langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/core only — NEVER add src/cendor/__init__.py
