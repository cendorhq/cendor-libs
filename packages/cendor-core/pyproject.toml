[project]
name = "cendor-core"
version = "1.3.1"
description = "Wrap your LLM client once and capture exact token counts and cost on every call — the shared foundation the other Cendor tools build on."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["llm", "ai", "agents", "llm", "tokens", "cost", "pricing", "instrumentation", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-libs"
Documentation = "https://cendor.ai/docs/core"
Repository = "https://github.com/cendorhq/cendor-libs"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
tiktoken = ["tiktoken>=0.7"]   # optional: exact OpenAI token counts (heuristic fallback otherwise)
# optional: the CendorCallbackHandler for LangChain/LangGraph (cendor.core.langchain). The handler
# reads only usage_metadata + run ids — a far more stable surface than client internals.
langchain = ["langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/core only — NEVER add src/cendor/__init__.py
