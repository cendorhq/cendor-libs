name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (PR pushes); never cancel a main-branch build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # development happens on Windows — test it too
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on the Windows runner, so `find`/heredocs work cross-platform
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # GATE — the lockfile must already match pyproject. `uv sync` alone SILENTLY UPDATES the lock,
      # so a version bump committed without re-locking never fails anything: measured 2026-07-27, the
      # committed uv.lock still said core 1.14.1 / cassette 1.1.0 / guardrails 1.6.0 while the
      # pyprojects had been bumped to 1.14.2 / 1.1.1 / 1.6.1 two commits earlier. `--check` turns that
      # into a red build instead of a diff someone notices later.
      - name: lockfile is in step with pyproject
        run: uv lock --check
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: namespace guard (no top-level cendor/__init__.py)
        run: |
          if find packages -path '*/src/cendor/__init__.py' | grep . ; then
            echo "ERROR: a top-level cendor/__init__.py exists — it breaks the namespace"; exit 1
          fi
      - name: type-check
        run: >-
          uv run mypy -p cendor.core -p cendor.tokenguard -p cendor.contextkit
          -p cendor.squeeze -p cendor.cassette -p cendor.acttrace -p cendor.guardrails
      - name: tests + coverage
        run: >-
          uv run pytest -q
          --cov=cendor --cov-report=term-missing --cov-report=json:coverage.json
          --cov-fail-under=80
      - name: per-package coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          data = json.loads(pathlib.Path("coverage.json").read_text())
          pkgs: dict[str, list[int]] = {}
          for path, info in data.get("files", {}).items():
              parts = path.replace(os.sep, "/").split("/")
              pkg = next((p for p in parts if p.startswith("cendor-")), None)
              if not pkg:
                  continue
              s = info["summary"]
              agg = pkgs.setdefault(pkg, [0, 0])
              agg[0] += s["num_statements"]
              agg[1] += s["missing_lines"]
          lines = ["| package | statements | missed | coverage |", "|---|---:|---:|---:|"]
          for pkg in sorted(pkgs):
              stmts, missed = pkgs[pkg]
              pct = 100 * (stmts - missed) / stmts if stmts else 100.0
              lines.append(f"| {pkg} | {stmts} | {missed} | {pct:.1f}% |")
          totals = data.get("totals", {})
          lines.append(f"| **TOTAL** | {totals.get('num_statements', 0)} | "
                       f"{totals.get('missing_lines', 0)} | "
                       f"{totals.get('percent_covered', 0):.1f}% |")
          text = "## Coverage by package\n\n" + "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          (open(summary, "a") if summary else sys.stdout).write(text)
          PY

  smoke:
    # Build the wheels from source and install them into a clean venv (no PyPI) on each Python,
    # to verify the shipped artifacts + the PEP 420 namespace import for a real user.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build all wheels
        run: |
          for p in cendor-core cendor-tokenguard cendor-contextkit \
                   cendor-squeeze cendor-cassette cendor-acttrace cendor-guardrails cendor-libs cendor; do
            uv build --package "$p"
          done
      - name: Vendor third-party runtime deps into the wheelhouse
        # cendor-core now hard-depends on tiktoken (exact token counts are the product, not an
        # add-on). Fetch tiktoken + its transitive deps into the same wheelhouse so the install
        # step below stays genuinely offline (--no-index) yet has everything the wheels need.
        # tiktoken is the only third-party runtime dependency across the stack.
        run: python -m pip download --dest dist tiktoken
      - name: Install from local wheels (offline) and import the namespace
        run: |
          python -m venv .smoke
          .smoke/bin/pip install --no-index --find-links dist cendor-libs
          .smoke/bin/python -c "import cendor.core, cendor.tokenguard, cendor.contextkit, cendor.squeeze, cendor.cassette, cendor.acttrace, cendor.guardrails; print('import ok')"
      # GATE G6 — the same thing again, with UV'S INSTALLER.
      #
      # The step above proves *pip* can lay eight distributions into one PEP 420 `cendor.*` namespace.
      # It does not prove uv can: uv ships its own installer (not a pip wrapper) and defaults to
      # hardlink/clone install modes, so the on-disk result is produced by different code. Cardinal
      # rule 1 — never a top-level `cendor/__init__.py` — is the blast radius for the entire stack,
      # and uv is now a documented, first-class way to install Cendor (`uv add cendor-libs`), so the
      # namespace has to be asserted under both installers or we are only half-checking it.
      #
      # Deliberately also installs the à-la-carte shape: `cendor-libs` pulls everything through one
      # resolve, whereas two separate installs into the same environment is the case where a stray
      # top-level __init__.py would actually shadow a sibling.
      - name: G6 — install from local wheels with uv and import the namespace
        run: |
          uv venv .smoke-uv --python ${{ matrix.python }}
          uv pip install --python .smoke-uv --no-index --find-links dist cendor-libs
          .smoke-uv/bin/python -c "import cendor.core, cendor.tokenguard, cendor.contextkit, cendor.squeeze, cendor.cassette, cendor.acttrace, cendor.guardrails; print('uv install: import ok')"
          # à la carte, two resolves into one env
          uv venv .smoke-uv2 --python ${{ matrix.python }}
          uv pip install --python .smoke-uv2 --no-index --find-links dist cendor-tokenguard
          uv pip install --python .smoke-uv2 --no-index --find-links dist cendor-acttrace
          .smoke-uv2/bin/python -c "import cendor.tokenguard, cendor.acttrace, cendor.core; print('uv à la carte: import ok')"
