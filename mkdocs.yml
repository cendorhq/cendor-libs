# MkDocs Material config — builds a docs site from the existing docs/ pages.
# LOCAL PREVIEW (nothing is deployed by this file):
#   pip install mkdocs-material
#   mkdocs serve            # → http://127.0.0.1:8000
#   mkdocs build            # → ./site (gitignored; do not commit)
# Mermaid renders via Material's built-in support (pymdownx.superfences custom fence below),
# so the docs/*.md diagrams show up properly here — including ones a strict viewer chokes on.

site_name: Cendor
site_description: >-
  Production plumbing for LLM apps — context, cost, testing, and governance — six small,
  composable, framework-agnostic Python libraries beneath your agent framework.
site_url: https://docs.cendor.ai/
repo_url: https://github.com/cendorhq/Cendor
repo_name: cendorhq/Cendor
copyright: Copyright 2026 Raghav Mishra (PowerAI Labs) — Apache-2.0
# docs_dir defaults to ./docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Libraries:
      - core: core.md
      - contextkit: contextkit.md
      - squeeze: squeeze.md
      - tokenguard: tokenguard.md
      - cassette: cassette.md
      - acttrace: acttrace.md
  - Providers & Integration: providers.md
  - Guides & Recipes: guides.md
  - Benchmarks: benchmarks.md
  - FAQ: faq.md
