# uv workspace root (not published). See CLAUDE.md for conventions.
[project]
name = "cendor-workspace"
version = "0.0.0"
description = "Cendor monorepo workspace root (not published)."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cendor-core = { workspace = true }
cendor-tokenguard = { workspace = true }
cendor-contextkit = { workspace = true }
cendor-squeeze = { workspace = true }
cendor-cassette = { workspace = true }
cendor-acttrace = { workspace = true }
cendor-guardrails = { workspace = true }
# The umbrella `cendor-libs` (pins the six) and the brand alias `cendor` (depends on cendor-libs)
# are also workspace members; the alias's dep on cendor-libs must resolve to the workspace copy.
cendor-libs = { workspace = true }

# Workspace members are listed here so a plain `uv sync` installs them (editable) into the
# dev environment, making `uv run pytest` work across all packages. They resolve via
# [tool.uv.sources] above. Add each new package here as it is scaffolded.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff==0.16.0",
  "mypy>=1.10",
  # Integration-test deps: exercise the real LangChain/LangGraph stack with HTTP mocked by respx
  # (no network, no keys). The tests importorskip these, so a plain install without them still runs.
  "respx>=0.21",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  # Framework-adapter test deps (GLR-11c / GLR-11b1): the OpenAI Agents SDK + Azure AI Foundry Agents.
  # The tests importorskip these, so a plain install without them still runs.
  "openai-agents>=0.1",
  "azure-ai-agents>=1.0",
  # OpenTelemetry (the `cendor-core[otel]` extra) — a TEST dep here, never a runtime one. The
  # telemetry-switch tests must observe real spans/metrics through a real (in-memory) provider, and
  # the provider predicate must be checked against the actual ProxyTracerProvider semantics. The
  # OTel-ABSENT path stays pinned by an import-blocking fixture (tests/_no_otel.py), so installing it
  # here does not cost us the local-first coverage.
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "cendor-core",
  "cendor-tokenguard",
  "cendor-contextkit",
  "cendor-squeeze",
  "cendor-cassette",
  "cendor-acttrace",
  "cendor-guardrails",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Markdown is documentation, not source — keep the formatter out of it.
#
# ruff 0.16.0 began formatting Python inside markdown by default. Measured 2026-07-28: that would
# rewrite the code samples in 48 published files across the two Python repos and NOT ONE .py file —
# every README, every docs page, and every bundled INTEGRATION.md. It collapses the deliberately
# aligned trailing comments those samples use to teach, inserts blank lines, and wraps one-line
# examples across three. `docs/for-ai-assistants.md` is worse than cosmetic: cendor-mcp parses its
# canonical examples by hard-anchored slug, so reformatting them changes what the MCP server teaches.
#
# The docs are hand-written for a reader. Excluding them here is a no-op on the pinned 0.15.20 (which
# does not touch markdown at all) and keeps the ruff version free to move.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Benchmark scripts carry inline sample data and long descriptive result strings; reflowing them
# under the 100-col limit hurts readability and they ship in no wheel. All other rules still apply.
"benchmarks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true

# Optional provider/telemetry SDKs are imported lazily behind try/except — they aren't
# installed by default, so don't fail type-checking when their stubs are absent.
[[tool.mypy.overrides]]
module = [
  "tiktoken.*",
  "opentelemetry.*",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "spacy.*",
]
ignore_missing_imports = true
